# Every push to main builds the React app + Worker and deploys them to Cloudflare.
# Needs one repo secret: CLOUDFLARE_API_TOKEN (see DEPLOY.md → "Auto-deploy from GitHub").
# Worker secrets (MONGODB_URI, ADMIN_KEY, SESSION_SECRET) already live on Cloudflare and are kept.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
